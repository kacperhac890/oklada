    <path d="M120 560 Q160 470 320 460 Q460 452 520 520 L700 528"/>
    <circle cx="250" cy="600" r="46"/><circle cx="620" cy="600" r="46"/>
  </g>
  <!-- 911 side silhouette -->
  <g transform="translate(0,40)">
    <path d="M150 760 Q200 660 360 656 Q470 654 520 700 Q560 690 690 700 L830 720 Q860 724 860 760 L862 800 L820 800 A48 48 0 0 0 724 800 L560 800 A48 48 0 0 0 464 800 L300 800 A48 48 0 0 0 204 800 L156 798 Q150 790 150 770 Z" fill="url(#pcar)"/>
    <path d="M210 700 Q260 672 360 670 Q450 668 496 704 Z" fill="#b9c6dd" opacity=".55"/>
    <rect x="700" y="656" width="150" height="16" rx="6" fill="#0f1a30"/>
    <rect x="710" y="642" width="14" height="20" fill="#0f1a30"/><rect x="826" y="642" width="14" height="20" fill="#0f1a30"/>
    <circle cx="252" cy="800" r="48" fill="#111827"/><circle cx="252" cy="800" r="22" fill="#c3cad6"/>
    <circle cx="772" cy="800" r="48" fill="#111827"/><circle cx="772" cy="800" r="22" fill="#c3cad6"/>
