  <text x="500" y="1330" font-size="18" fill="#ffffff" text-anchor="middle" opacity=".8" font-family="Arial,sans-serif">HIGH-PERFORMANCE · MOTORSPORT DERIVED · NAT. ASPIRATED FLAT-6</text>
