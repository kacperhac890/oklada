<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414" font-family="'Trebuchet MS','Segoe UI',sans-serif">
  <rect width="1000" height="1414" fill="#f1ece0"/>
  <!-- green frame -->
  <rect x="46" y="46" width="908" height="1322" fill="none" stroke="#2f8159" stroke-width="14"/>
  <!-- green table -->
  <rect x="60" y="900" width="880" height="454" fill="#3a9b6e"/>
  <!-- titles -->
  <text x="120" y="180" font-size="34" fill="#2f8159" font-weight="700">summer may fade</text>
  <text x="880" y="176" font-size="70" fill="#e8562a" font-weight="800" text-anchor="end" font-family="'Arial Black',Arial,sans-serif">APEROL</text>
  <text x="880" y="248" font-size="70" fill="#e8562a" font-weight="800" text-anchor="end" font-family="'Arial Black',Arial,sans-serif">FOR-EVER</text>
  <!-- crown + star -->
  <path d="M470 320 l16 40 l40 -30 l-8 54 l-96 0 l-8 -54 l40 30 z" fill="#e9c23d"/>
  <g fill="#e9c23d"><path d="M760 300 l14 40 l42 2 l-33 27 l12 41 l-35 -24 l-35 24 l12 -41 l-33 -27 l42 -2 z"/></g>
  <!-- vase with flowers -->
  <g transform="translate(215,470)">
    <circle cx="-40" cy="-40" r="34" fill="#c0392b"/><circle cx="35" cy="-58" r="30" fill="#3d6fb0"/>
    <circle cx="60" cy="4" r="30" fill="#e6b93b"/><circle cx="-8" cy="-92" r="30" fill="#7d4fa0"/>
    <circle cx="-70" cy="20" r="26" fill="#e07a3a"/><circle cx="18" cy="-16" r="20" fill="#f1ece0"/>
    <path d="M-55 40 L-70 200 L80 200 L60 40 z" fill="#f1ece0" stroke="#2f8159" stroke-width="6"/>
    <path d="M-64 110 q70 24 132 0" fill="none" stroke="#c0392b" stroke-width="6"/>
    <path d="M-2 40 L-2 200" stroke="#3a9b6e" stroke-width="5"/>
  </g>
  <!-- figure -->
  <g transform="translate(560,560)">
    <!-- hair -->
    <g fill="#f7f4ee" stroke="#2b2b2b" stroke-width="4">
      <circle cx="0" cy="-60" r="70"/><circle cx="-70" cy="-30" r="48"/><circle cx="70" cy="-30" r="48"/>
      <circle cx="-46" cy="-92" r="42"/><circle cx="46" cy="-92" r="42"/><circle cx="0" cy="-110" r="40"/>
    </g>
    <!-- face -->
    <path d="M-64 -40 q0 90 64 96 q64 -6 64 -96 q0 -46 -64 -46 q-64 0 -64 46 z" fill="#f0c9a5" stroke="#2b2b2b" stroke-width="4"/>
    <!-- sunglasses -->
    <g fill="#1c1c1c"><path d="M-58 -30 q-6 40 30 40 q34 0 30 -40 z"/><path d="M58 -30 q6 40 -30 40 q-34 0 -30 -40 z"/><rect x="-6" y="-30" width="12" height="8"/></g>
    <!-- lips + straw -->
    <path d="M-16 40 q16 18 34 0 q-16 10 -34 0z" fill="#c0392b"/>
    <line x1="30" y1="70" x2="70" y2="150" stroke="#c0392b" stroke-width="5"/>
    <!-- jacket -->
    <path d="M-120 60 q40 -30 120 -30 q80 0 120 30 L150 300 L-150 300 z" fill="#e6b93b" stroke="#2b2b2b" stroke-width="4"/>
    <path d="M-30 34 L0 130 L30 34" fill="#f7f4ee" stroke="#2b2b2b" stroke-width="4"/>
    <g fill="#1c1c1c"><circle cx="-70" cy="120" r="8"/><circle cx="-40" cy="180" r="8"/><circle cx="70" cy="120" r="8"/><circle cx="90" cy="200" r="8"/><circle cx="-95" cy="210" r="8"/><circle cx="20" cy="150" r="8"/><circle cx="55" cy="240" r="8"/><circle cx="-55" cy="255" r="8"/></g>
    <!-- glass with spritz -->
    <g transform="translate(70,150)"><path d="M-30 0 h60 l-10 70 h-40 z" fill="#e8562a" stroke="#2b2b2b" stroke-width="4"/><line x1="0" y1="70" x2="0" y2="120" stroke="#2b2b2b" stroke-width="4"/><line x1="-24" y1="120" x2="24" y2="120" stroke="#2b2b2b" stroke-width="4"/><circle cx="24" cy="6" r="12" fill="#e8562a" stroke="#2b2b2b" stroke-width="3"/></g>
  </g>
  <!-- table objects -->
  <g stroke="#2b2b2b" stroke-width="4">
    <rect x="150" y="960" width="70" height="230" rx="14" fill="#f1ece0"/>
    <rect x="168" y="930" width="34" height="40" fill="#f1ece0"/>
    <g fill="#f7f4ee"><rect x="300" y="1080" width="70" height="96" rx="6" transform="rotate(-12 335 1128)"/><rect x="360" y="1090" width="70" height="96" rx="6" transform="rotate(8 395 1138)"/></g>
    <circle cx="336" cy="1110" r="6" fill="#c0392b" stroke="none"/><circle cx="396" cy="1120" r="6" fill="#1c1c1c" stroke="none"/>
    <ellipse cx="620" cy="1150" rx="130" ry="70" fill="#eef1f4"/>
    <path d="M520 1150 q80 -60 160 0 q-80 60 -160 0z M680 1150 l40 -26 l0 52 z" fill="#5b86b0"/>
    <circle cx="560" cy="1140" r="5" fill="#1c1c1c" stroke="none"/>
    <circle cx="810" cy="1050" r="46" fill="#e8562a"/><path d="M810 1004 v92 M764 1050 h92 M778 1018 l64 64 M842 1018 l-64 64" stroke="#f1ece0" stroke-width="3"/>
  </g>
</svg>
